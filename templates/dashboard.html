<!DOCTYPE html>
<html>
<head>
<title>AgriAssist Pro Dashboard</title>

<link rel="stylesheet" href="/static/css/dashboard.css">
<link rel="stylesheet" href="/static/css/dark.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>


<nav>
<h1>🌱 AgriAssist Pro</h1>

<button onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</nav>


<div class="container">


<div class="card">
<h2>🌦 Weather Intelligence</h2>

<p id="weather">
Loading weather...
</p>

</div>



<div class="card">

<h2>
🤖 AI Farmer Assistant
</h2>

<input id="question"
placeholder="Ask about farming...">

<button onclick="askAI()">
Ask
</button>

<p id="answer"></p>

</div>




<div class="card">

<h2>
🔍 Crop Disease Search
</h2>


<input id="diseaseSearch"
placeholder="Search disease">


<div id="diseaseResults"></div>


</div>




<div class="card">

<h2>
📈 Market Trends
</h2>


<canvas id="marketChart"></canvas>


</div>





<div class="card">

<h2>
🌾 Farming Tips
</h2>


<div id="tips"></div>


</div>




<div class="card">

<h2>
💰 Market Prices
</h2>


<div id="markets"></div>


</div>


</div>



<script src="/static/js/darkmode.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/charts.js"></script>


</body>

</html>
